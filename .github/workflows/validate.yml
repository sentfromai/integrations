name: Validate integrations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  n8n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: n8n/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
  zapier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zapier/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node make/test-contract.mjs
