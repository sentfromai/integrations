name: Publish SentFromAI n8n package

on:
  push:
    tags: ["n8n-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: n8n/package-lock.json
      - name: Check release tag matches package version
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'n8n-v' + version) throw new Error('Run on the n8n-v' + version + ' tag');"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Publish with npm provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
